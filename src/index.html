<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Technical Copilot — Prototype</title>
  <meta name="description" content="Interactive prototype of the AI Technical Copilot. Simulated, illustrative content. Not manufacturer guidance.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E1217">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stage.css">
</head>
<body data-view="mobile">
  <main class="stage">
    <section id="view-mobile" aria-label="Mobile prototype (testable)">
      <div id="device-wrap" class="device-wrap">
        <div id="device" class="device">
          <span class="hw hw--action" aria-hidden="true"></span><span class="hw hw--vol1" aria-hidden="true"></span>
          <span class="hw hw--vol2" aria-hidden="true"></span><span class="hw hw--power" aria-hidden="true"></span>
          <div class="device-screen">
            <div class="statusbar" aria-hidden="true">
              <span>9:41</span>
              <span class="sb-icons">
                <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
                <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
              </span>
            </div>
            <span class="island" aria-hidden="true"></span>
            <div id="app" class="app" data-screen="home" data-sidebar="closed">
              <div id="main" class="app-main"></div>
              <div id="scrim" class="scrim"></div>
              <aside id="sidebar" class="sidebar" aria-label="Menu" inert></aside>
              <section id="source" class="source" aria-label="Source detail" inert></section>
              <div id="toast" class="toast" role="status"></div>
            </div>
            <span class="home-indicator" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>

    <section id="view-desktop" hidden aria-label="Desktop preview (not interactive)">
      <div class="desk-top">
        <p class="desk-note">Desktop preview · not interactive. Test the flow on mobile.</p>
        <div class="desk-tabs" role="group" aria-label="Desktop preview screen">
          <button class="ctl" data-desk-tab="answer" aria-pressed="true">Answer + source</button>
          <button class="ctl" data-desk-tab="home" aria-pressed="false">Home</button>
        </div>
      </div>
      <div id="desk-wrap" class="desk-wrap">
        <div id="desk-frame" class="browser">
          <div class="browser-bar" aria-hidden="true"><i></i><i></i><i></i><span class="addr">localhost · AI Technical Copilot</span></div>
          <div id="desk-canvas" class="desk-canvas" inert></div>
        </div>
      </div>
    </section>

    <div class="controls">
      <button id="restart" class="ctl" type="button">Restart demo</button>
      <button id="toggle-view" class="ctl ctl--primary" type="button" aria-pressed="false">View desktop version</button>
    </div>
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
